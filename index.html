<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brillance Châtre • Bijoux en Argent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', system_ui, sans-serif; }
        .logo-font { font-family: 'Playfair Display', serif; }

        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.55)), 
                        url('https://i.postimg.cc/pPzZytpM/Gemini-Generated-Image-j1hy1ej1hy1ej1hy.png') center/cover no-repeat fixed;
        }

        .silver-button {
            background: linear-gradient(90deg, #c0c0c0, #a8a8a8);
            color: #1f2937;
        }

        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-8px); }

        .modal { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-zinc-50 scroll-smooth">

    <!-- NAVBAR -->
    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                     alt="Brillance Châtre" class="w-12 h-12 rounded-full object-contain border border-zinc-200">
                <div>
                    <h1 class="logo-font text-3xl font-bold tracking-tighter text-zinc-800">BRILLANCE</h1>
                    <p class="text-zinc-600 font-medium tracking-widest text-sm">CHÂTRE</p>
                </div>
            </div>

            <div class="hidden md:flex gap-8 text-sm font-medium text-zinc-700">
                <a onclick="navigateTo('home')" class="cursor-pointer hover:text-zinc-500">Accueil</a>
                <a onclick="navigateTo('shop')" class="cursor-pointer hover:text-zinc-500">Boutique</a>
                <a onclick="navigateTo('about')" class="cursor-pointer hover:text-zinc-500">Notre Histoire</a>
            </div>

            <button onclick="showCart()" class="flex items-center gap-2 bg-white border border-zinc-200 px-5 py-2.5 rounded-3xl text-sm font-medium">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count" class="bg-zinc-800 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- HERO -->
    <section id="home" class="hero-bg min-h-screen flex items-center py-12 text-white">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                 alt="Brillance Châtre" class="mx-auto w-72 md:w-96 h-72 md:h-96 rounded-full object-contain shadow-2xl border-8 border-white/80 mb-8">
            <h1 class="logo-font text-5xl md:text-7xl font-bold tracking-tighter">BRILLANCE CHÂTRE</h1>
            <p class="mt-3 text-xl md:text-2xl">Bijoux en argent fin • Élégance intemporelle</p>
        </div>
    </section>

    <!-- SHOP -->
    <section id="shop" class="max-w-7xl mx-auto px-4 py-16">
        <h2 class="text-4xl font-semibold text-center mb-12 text-zinc-800">Notre Collection</h2>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>

    <!-- PRODUCT DETAIL MODAL -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center">
        <div class="bg-white rounded-3xl max-w-lg w-full mx-4 overflow-hidden">
            <div class="p-6">
                <button onclick="closeModal()" class="float-right text-3xl text-zinc-400">×</button>
                <img id="modal-image" class="w-full h-80 object-cover rounded-2xl mb-6" alt="">
                <h2 id="modal-name" class="text-2xl font-semibold mb-2"></h2>
                <p id="modal-desc" class="text-zinc-600 mb-6"></p>
                <p id="modal-price" class="text-3xl font-bold text-zinc-800"></p>
            </div>
            <div class="p-6 border-t flex gap-4">
                <button onclick="addCurrentToCart()" 
                        class="flex-1 bg-zinc-900 text-white py-4 rounded-2xl font-medium">Ajouter au Panier</button>
                <button onclick="closeModal()" 
                        class="flex-1 border border-zinc-300 py-4 rounded-2xl font-medium">Fermer</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-zinc-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <img src="https://i.postimg.cc/xXLWm86w/Gemini-Generated-Image-2026-04-03-at-14-33-12.png" 
                 class="w-16 h-16 mx-auto rounded-full mb-6" alt="">

            <div class="flex justify-center gap-10 text-4xl mb-8">
                <a href="https://www.instagram.com/brillance_chatre" target="_blank" class="hover:text-pink-400">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://wa.me/212720114319" target="_blank" class="hover:text-green-400">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>

            <p class="text-zinc-400">© 2026 Brillance Châtre • Casablanca, Maroc</p>
        </div>
    </footer>

    <!-- CART MODAL -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/70 z-[200] flex items-end md:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-3xl md:rounded-3xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-6 border-b flex justify-between">
                <h2 class="text-2xl font-semibold">Votre Panier</h2>
                <button onclick="hideCart()" class="text-3xl">×</button>
            </div>
            <div id="cart-items" class="flex-1 p-6 overflow-auto"></div>
            <div class="p-6 border-t">
                <div class="flex justify-between text-xl mb-6">
                    <span>Total</span>
                    <span id="cart-total" class="font-bold">0 MAD</span>
                </div>
                <button onclick="showPaymentModal()" 
                        class="silver-button w-full py-5 rounded-3xl text-lg font-semibold">PAYER PAR CARTE BANCAIRE</button>
            </div>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black/70 z-[300] flex items-center justify-center">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
            <h2 class="text-2xl font-semibold mb-6 text-center">Paiement Sécurisé</h2>
            <div class="space-y-4">
                <input type="text" placeholder="Numéro de carte" class="w-full border p-4 rounded-2xl" value="4242 4242 4242 4242">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="MM/AA" class="border p-4 rounded-2xl" value="12/28">
                    <input type="text" placeholder="CVC" class="border p-4 rounded-2xl" value="123">
                </div>
                <button onclick="completePayment()" 
                        class="w-full bg-emerald-600 text-white py-5 rounded-3xl text-lg font-semibold">PAYER MAINTENANT</button>
            </div>
            <button onclick="hidePaymentModal()" class="mt-4 text-zinc-500 w-full">Annuler</button>
        </div>
    </div>

    <script>
        let products = [
            {id:1, name:"Bracelet rivière argent rhodié oxydes de zirconium", price:350, img:"https://img.sanishtech.com/u/24a17e0c34a0cd8c412180b45309bf74.jpeg"},
            {id:2, name:"Bracelet « Trio éclat » argent 925 zircon baguette", price:220, img:"https://img.sanishtech.com/u/76eb3318602d5c3b3c61cc5d202e423e.jpeg"},
            {id:3, name:"Éclat Royal – Bracelet en argent 925 avec pierre carrée halo", price:189, img:"https://img.sanishtech.com/u/e46cd37bae44b05f8086d4dcb1e59e35.jpeg"},
            {id:4, name:"Bracelet \"Couronne Royale\" – Argent Sterling 925", price:200, img:"https://img.sanishtech.com/u/4f012b402dd43e3a57bf52877ef66ae7.jpeg"},
            {id:5, name:"Bracelet \"Infini Éternel\" en Argent 925", price:220, img:"https://img.sanishtech.com/u/b0f0c402d5afdde0dd62916f29bfdc0f.jpeg"},
            {id:6, name:"Bracelet \"Flocon de Neige\" Multicercle — Argent Sterling S925", price:300, img:"https://img.sanishtech.com/u/bfe3c448af726ae829bbaca7554caea4.jpeg"},
            {id:7, name:"Bracelet \"Clou de Lumière\" en Argent 925", price:200, img:"https://img.sanishtech.com/u/83a4160e0a5c39177b8167ad46eec5de.jpeg"},
            {id:8, name:"Bracelet \"Amulettes de Chance\" Multi-Breloques — Argent S925", price:270, img:"https://img.sanishtech.com/u/f2ec2581b71909b035d35e99df0d5a1c.jpeg"},
            {id:9, name:"Bracelet \"Soleils d'Orient\" Multicharmes — Argent S925", price:240, img:"https://img.sanishtech.com/u/7708abe2fef86e9341c5d832da1de42b.jpeg"},
            {id:10, name:"Bracelet Cœur Noir Précieux en Argent 925", price:230, img:"https://img.sanishtech.com/u/06815f3933fe0dd5428287f3bc297feb.jpeg"},
            {id:11, name:"Bracelet \"Pulsation Verte\" – Argent Sterling 925", price:230, img:"https://img.sanishtech.com/u/0f07bbf7e62a6e9e14ebd9e3abf3034e.jpeg"},
            {id:12, name:"Bracelet \"Splendeur d'Orient\" – Argent Sterling 925", price:440, img:"https://img.sanishtech.com/u/c30b5b6e5cd8a59c82b1ba0c30ab31f4.jpeg"}
        ];

        let cart = [];
        let currentProduct = null;

        function renderProducts() {
            const container = document.getElementById('products-grid');
            container.innerHTML = '';
            products.forEach(p => {
                container.innerHTML += `
                <div onclick="showProduct(${p.id})" class="product-card bg-white rounded-3xl overflow-hidden shadow-sm cursor-pointer">
                    <img src="${p.img}" class="w-full aspect-square object-cover">
                    <div class="p-4">
                        <h3 class="font-medium line-clamp-2 h-12">${p.name}</h3>
                        <p class="text-xl font-bold text-zinc-800 mt-3">${p.price} DH</p>
                    </div>
                </div>`;
            });
        }

        function showProduct(id) {
            currentProduct = products.find(p => p.id === id);
            if (!currentProduct) return;

            document.getElementById('modal-image').src = currentProduct.img;
            document.getElementById('modal-name').textContent = currentProduct.name;
            document.getElementById('modal-price').textContent = currentProduct.price + " DH";
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function addCurrentToCart() {
            if (!currentProduct) return;
            addToCart(currentProduct.id);
            closeModal();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(i => i.id === id);
            if (existing) existing.quantity = (existing.quantity || 1) + 1;
            else cart.push({...product, quantity: 1});
            updateCartCount();
            showToast(product.name + " ajouté au panier");
        }

        function updateCartCount() {
            const count = cart.reduce((a, c) => a + (c.quantity || 1), 0);
            document.getElementById('cart-count').textContent = count;
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#444;color:white;padding:14px 24px;border-radius:9999px;z-index:10000;';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function showCart() {
            document.getElementById('cart-modal').classList.remove('hidden');
            renderCart();
        }

        function hideCart() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCart() {
            let html = '', total = 0;
            const container = document.getElementById('cart-items');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center py-12 text-zinc-400">Votre panier est vide</p>`;
                document.getElementById('cart-total').textContent = '0 MAD';
                return;
            }

            cart.forEach((item, i) => {
                const itemTotal = item.price * (item.quantity || 1);
                total += itemTotal;
                html += `
                <div class="flex gap-4 border-b pb-6">
                    <img src="${item.img}" class="w-20 h-20 object-cover rounded-2xl">
                    <div class="flex-1">
                        <div class="font-medium">${item.name}</div>
                        <div class="text-sm text-zinc-500">${itemTotal} DH</div>
                        <div class="flex gap-4 mt-3">
                            <button onclick="changeQty(${i}, -1)" class="px-3 border">-</button>
                            <span>${item.quantity || 1}</span>
                            <button onclick="changeQty(${i}, 1)" class="px-3 border">+</button>
                            <button onclick="removeItem(${i})" class="ml-auto text-red-500">Supprimer</button>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('cart-total').textContent = total + ' DH';
        }

        function changeQty(i, delta) {
            cart[i].quantity = Math.max(1, (cart[i].quantity || 1) + delta);
            renderCart();
            updateCartCount();
        }

        function removeItem(i) {
            cart.splice(i, 1);
            renderCart();
            updateCartCount();
        }

        function showPaymentModal() {
            hideCart();
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function hidePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function completePayment() {
            alert("✅ Paiement réussi ! Merci pour votre commande chez Brillance Châtre.\n\nVous recevrez une confirmation sur WhatsApp.");
            hidePaymentModal();
            cart = [];
            updateCartCount();
        }

        function sendOrderToWhatsApp() {
            // Optional: you can keep this too
            alert("Commande envoyée sur WhatsApp !");
        }

        function filterProducts() {
            // Optional search if you want to keep it
        }

        function toggleMobileMenu() {
            // Optional
        }

        function navigateTo(section) {
            document.getElementById(section).scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize
        window.onload = () => {
            renderProducts();
        };
    </script>
</body>
</html>
